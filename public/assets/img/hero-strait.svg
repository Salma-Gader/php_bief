<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- The Strait of Gibraltar from Tanger at sunset: sky, setting sun, Spanish coast,
       sea, medina rooftops and the limewashed terrace wall the page continues from. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A4A"/>
      <stop offset=".38" stop-color="#28457A"/>
      <stop offset=".62" stop-color="#8E5C88"/>
      <stop offset=".84" stop-color="#E2725B"/>
      <stop offset="1" stop-color="#F2A541"/>
    </linearGradient>
    <radialGradient id="glow" cx="1110" cy="612" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD58F" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#F2A541" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9785F"/>
      <stop offset=".12" stop-color="#3E4F80"/>
      <stop offset=".55" stop-color="#1B3B66"/>
      <stop offset="1" stop-color="#0E2A4A"/>
    </linearGradient>
    <pattern id="tiles" width="28" height="14" patternUnits="userSpaceOnUse">
      <rect width="28" height="14" fill="#3D7DCA"/>
      <path d="M14 1 21 7 14 13 7 7Z" fill="#F4F7F9"/>
      <path d="M0 4 3 7 0 10ZM28 4 25 7 28 10Z" fill="#2E8B6E"/>
    </pattern>
  </defs>

  <rect width="1600" height="626" fill="url(#sky)"/>
  <rect width="1600" height="626" fill="url(#glow)"/>
  <circle cx="1110" cy="612" r="56" fill="#FFE1A6"/>

  <!-- Spanish coast across the Strait -->
  <path d="M0 614C150 604 260 590 400 598S700 586 860 600 1180 586 1360 597 1600 604 1600 604V628H0Z" fill="#5A4A78"/>

  <!-- Sea and the sun's reflection -->
  <rect y="624" width="1600" height="376" fill="url(#sea)"/>
  <g fill="#FFCB7A">
    <rect x="1040" y="640" width="140" height="5" rx="2.5" opacity=".8"/>
    <rect x="1060" y="660" width="100" height="5" rx="2.5" opacity=".65"/>
    <rect x="1025" y="684" width="170" height="5" rx="2.5" opacity=".5"/>
    <rect x="1075" y="712" width="70" height="5" rx="2.5" opacity=".45"/>
    <rect x="1035" y="746" width="150" height="5" rx="2.5" opacity=".3"/>
    <rect x="1080" y="786" width="60" height="5" rx="2.5" opacity=".25"/>
  </g>

  <!-- Medina, right side: houses and a minaret -->
  <g fill="#E8EEF4">
    <rect x="1420" y="560" width="66" height="250"/>
    <rect x="1434" y="512" width="38" height="48"/>
    <rect x="1240" y="790" width="150" height="170"/>
    <rect x="1370" y="740" width="130" height="220"/>
    <rect x="1490" y="770" width="110" height="190"/>
    <rect x="1150" y="860" width="110" height="100"/>
  </g>
  <path d="M1453 474c-6 14-19 22-19 38h38c0-16-13-24-19-38Z" fill="#E8EEF4"/>
  <g fill="#C3CEDB">
    <rect x="1472" y="560" width="14" height="250"/>
    <rect x="1372" y="790" width="18" height="170"/>
    <rect x="1484" y="740" width="16" height="220"/>
    <rect x="1244" y="860" width="16" height="100"/>
  </g>
  <rect x="1420" y="588" width="66" height="12" fill="#2E8B6E"/>
  <g fill="#3D7DCA">
    <path d="M1444 640a9 9 0 0 1 18 0v26h-18Z"/>
    <path d="M1290 900a14 14 0 0 1 28 0v60h-28Z"/>
    <path d="M1415 880a14 14 0 0 1 28 0v80h-28Z"/>
    <path d="M1530 900a12 12 0 0 1 24 0v60h-24Z"/>
    <rect x="1180" y="890" width="22" height="18" rx="2"/>
  </g>

  <!-- Medina, left side: low rooftops -->
  <g fill="#E8EEF4">
    <rect y="880" width="170" height="80"/>
    <rect x="160" y="900" width="140" height="60"/>
    <rect x="290" y="870" width="120" height="90"/>
  </g>
  <g fill="#3D7DCA">
    <path d="M60 920a12 12 0 0 1 24 0v40H60Z"/>
    <path d="M330 910a12 12 0 0 1 24 0v50h-24Z"/>
  </g>

  <!-- Terrace wall with a zellige band -->
  <rect y="950" width="1600" height="10" fill="url(#tiles)"/>
  <rect y="958" width="1600" height="42" fill="#F4F7F9"/>
</svg>
